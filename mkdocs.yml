site_name: ML Theses
site_description: A guide to doing a bachelor's, master's, or doctoral thesis in applied machine learning, plus open topics and a directory of supervised theses — by Alex Jung (Aalto University, IMC Krems).
site_url: https://ml-theses.org
site_author: Alex Jung

repo_url: https://github.com/alexjungaalto/mlthesis
repo_name: alexjungaalto/mlthesis
edit_uri: edit/main/

# Generated by build_site.sh from the repo's source-of-truth files
# (README.md, topics.csv, theses.csv). Do not edit docs/ by hand.
docs_dir: docs
site_dir: site

# Keep .html file extensions so relative links (raw <img> tags, material/*.pdf
# downloads) resolve the same way they do in the GitHub repo.
use_directory_urls: false

theme:
  name: material
  # Template overrides (Open Graph / Twitter Card tags for link previews).
  custom_dir: web/overrides
  language: en
  features:
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Thesis Guide: README.md
  - Thesis Garage: Garage.md
  - Open Topics: Topics.md
  - Supervised Theses: theses.md
  - Research Areas:
      - Federated and distributed learning: areas/federated-learning.md
      - Graphs and networked data: areas/graphs-networked-data.md
      - Large language models and generative AI: areas/llms-generative-ai.md
      - Trustworthy and explainable AI: areas/trustworthy-explainable-ai.md
      - Anomaly, intrusion and fraud detection: areas/anomaly-fraud-detection.md
      - Computer vision: areas/computer-vision.md
      - Natural language processing and text mining: areas/nlp-text-mining.md
      - Time series and forecasting: areas/time-series-forecasting.md
      - Finance and business analytics: areas/finance-business-analytics.md
      - Health and biosignals: areas/health-biosignals.md
      - Reinforcement learning and control: areas/reinforcement-learning-control.md
      - ML systems and engineering: areas/ml-systems-engineering.md
      - Recommenders, personalisation and advertising: areas/recommenders-personalisation.md
      - ML education and society: areas/ml-education-society.md
  - Thesis Linters: assets/linters/README.md

# Per-thesis summary pages are reached from the Supervised Theses table, not
# from the nav bar (there are too many for a menu). Listing them here keeps
# `mkdocs build --strict` from failing them as pages missing from the nav.
not_in_nav: |
  /theses/*.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra:
  # Hide the "Made with Material for MkDocs" generator attribution.
  generator: false

copyright: Copyright &copy; Alex Jung
